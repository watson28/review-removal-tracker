[project]
name = "review-removal-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "sqlalchemy>=2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/review_removal_tracker"]

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
    "pytest>=8.0",
]
