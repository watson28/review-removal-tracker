[project]
name = "review-removal-tracker"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13",
    "httpx>=0.27",
    "psycopg[binary]>=3.2",
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "tenacity>=8.3",
]

[project.scripts]
rrt-snapshot = "review_removal_tracker.data_collection.cli:run_snapshot"
rrt-discovery = "review_removal_tracker.data_collection.cli:run_discovery"

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/review_removal_tracker"]

[dependency-groups]
dev = [
    "hatchling>=1.29.0",
    "pyrefly>=0.58.0",
    "pytest>=8.0",
    "pytest-httpx>=0.30",
]
