---
- name: Deploy Review Removal Tracker
  hosts: all
  become: true

  tasks:
    - name: Install Docker and dependencies
      apt:
        name:
          - docker.io
          - docker-compose-plugin
          - containerd
        state: present
        update_cache: true

    - name: Enable and start Docker
      systemd:
        name: docker
        enabled: true
        state: started

    - name: Create app directory
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: "0750"

    - name: Deploy docker-compose.yml
      template:
        src: templates/docker-compose.yml.j2
        dest: "{{ app_dir }}/docker-compose.yml"
        mode: "0640"

    - name: Deploy .env file
      template:
        src: templates/env.j2
        dest: "{{ app_dir }}/.env"
        mode: "0600"

    - name: Authenticate to ghcr.io
      command: >
        docker login ghcr.io
        -u {{ github_username }}
        --password-stdin
      args:
        stdin: "{{ github_pat }}"

    - name: Pull latest image
      command: docker compose pull
      args:
        chdir: "{{ app_dir }}"

    - name: Run database migrations
      command: docker compose run --rm app uv run alembic upgrade head
      args:
        chdir: "{{ app_dir }}"

    - name: Deploy systemd service and timer units
      template:
        src: "templates/{{ item }}.j2"
        dest: "/etc/systemd/system/{{ item }}"
        mode: "0644"
      loop:
        - rrt-snapshot.service
        - rrt-snapshot.timer
        - rrt-discovery.service
        - rrt-discovery.timer
      notify: Reload systemd

    - name: Enable and start timers
      systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - rrt-snapshot.timer
        - rrt-discovery.timer

  handlers:
    - name: Reload systemd
      systemd:
        daemon_reload: true
